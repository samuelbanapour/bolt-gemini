services:
  - type: web
    name: bolt-gemini-platform
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: GEMINI_API_KEY
        sync: false
      - key: RENDER_API_KEY
        sync: false
